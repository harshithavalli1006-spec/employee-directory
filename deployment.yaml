apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-directory
spec:
  replicas: 3
  selector:
    matchLabels:
      app: employee-directory
  template:
    metadata:
      labels:
        app: employee-directory
    spec:
      containers:
        - name: employee-directory
          image: employee-directory:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080